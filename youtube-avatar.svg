<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04080F"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="400" cy="400" r="400" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="400" cy="400" r="370" fill="none" stroke="url(#ring)" stroke-width="2"/>

  <!-- Big bold Q -->
  <text
    x="400" y="460"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="420"
    font-weight="700"
    fill="url(#cyan)"
    text-anchor="middle"
    dominant-baseline="auto">Q</text>

  <!-- Underline accent -->
  <rect x="240" y="530" width="320" height="6" rx="3" fill="#22D3EE" opacity="0.5"/>

  <!-- QUANTDIVER small text -->
  <text
    x="400" y="590"
    font-family="Arial, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#EDF2FF"
    text-anchor="middle"
    letter-spacing="10"
    opacity="0.7">QUANTDIVER</text>
</svg>
